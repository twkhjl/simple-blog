name: Worker Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run worker checks
        working-directory: worker
        run: npm run check

